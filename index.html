<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>数据中心运维（高级）工程师 · 考前刷题</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231e3a8a'/%3E%3Ctext x='32' y='42' font-size='28' text-anchor='middle' fill='white' font-family='serif'%3E算%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#eef2f7; --card:#fff; --ink:#0f172a; --muted:#64748b;
  --blue:#1d4ed8; --blue-d:#1e3a8a; --line:#e2e8f0;
  --green:#15803d; --green-bg:#dcfce7; --green-line:#86efac;
  --red:#b91c1c; --red-bg:#fee2e2; --red-line:#fca5a5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.6}
header{background:linear-gradient(135deg,#1e3a8a,#1d4ed8);color:#fff;padding:16px 16px 0;position:sticky;top:0;z-index:10;box-shadow:0 4px 14px rgba(15,23,42,.18)}
.head-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;max-width:760px;margin:0 auto}
h1{font-size:18.5px;margin:0;font-weight:700;letter-spacing:.5px}
.brand p{margin:4px 0 0;font-size:12px;color:#c7d2fe}
.mini{text-align:right;flex:0 0 auto}
.mini-num{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.mini-num span{font-size:12px;color:#c7d2fe;font-weight:400}
.mini-lab{font-size:11px;color:#c7d2fe;white-space:nowrap}
.mini-lab b{color:#fff}
.tabs{display:flex;gap:4px;max-width:760px;margin:14px auto 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:transparent;color:#c7d2fe;font-size:14px;padding:9px 14px;border-radius:10px 10px 0 0;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:inherit}
.tab.active{background:var(--bg);color:var(--blue-d);font-weight:700}
.dot{background:#ef4444;color:#fff;border-radius:99px;font-size:10px;min-width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px;font-weight:700}
main{max-width:760px;margin:0 auto;padding:14px 14px calc(30px + env(safe-area-inset-bottom))}
.panel{display:none}
.panel.active{display:block}
.toolbar{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.toolbar-2{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.chip-row{display:flex;gap:4px;background:#e2e8f2;padding:4px;border-radius:11px}
.bank-row{flex-wrap:wrap;gap:6px;padding:5px}
.chip{border:0;background:transparent;color:#475569;font-size:13px;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-family:inherit}
.chip.active{background:#fff;color:var(--blue-d);box-shadow:0 1px 2px rgba(15,23,42,.14)}
.chip.bank{font-size:13.5px;padding:7px 14px}
.chip.bank .cnt{font-size:11px;opacity:.65;margin-left:3px;font-weight:600}
.progress{height:6px;border-radius:99px;background:#dbe3ee;margin:2px 2px 12px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3b82f6,#22c55e);border-radius:99px;transition:width .25s}
.qcard{background:var(--card);border-radius:14px;box-shadow:0 1px 3px rgba(15,23,42,.08);padding:18px 16px 16px}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.badge{font-size:11px;padding:2.5px 9px;border-radius:99px;font-weight:700;letter-spacing:.3px}
.badge.single{background:#dbeafe;color:#1d4ed8}
.badge.multi{background:#ede9fe;color:#6d28d9}
.badge.judge{background:#ccfbf1;color:#0f766e}
.badge.src{background:#f1f5f9;color:#64748b;font-weight:500}
.badge.wrongtag{background:#fee2e2;color:#b91c1c;font-weight:600}
.qidx{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.stem{font-size:17px;font-weight:600;line-height:1.72;margin:4px 0 16px;white-space:pre-wrap;word-break:break-word}
.hint{font-size:12px;color:#7c3aed;margin:-8px 0 12px}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15.5px;color:var(--ink);margin-bottom:9px;cursor:pointer;transition:border-color .15s,background .15s;align-items:flex-start;font-family:inherit;line-height:1.6}
.opt:active{transform:scale(.995)}
.opt .letter{flex:0 0 25px;height:25px;border-radius:8px;background:#f1f5f9;color:#475569;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.opt .content{flex:1;min-width:0;word-break:break-word}
.opt.sel{border-color:var(--blue);background:#eff6ff}
.opt.sel .letter{background:var(--blue);color:#fff}
.opt.correct{border-color:var(--green-line);background:var(--green-bg)}
.opt.correct .letter{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red-line);background:var(--red-bg)}
.opt.wrong .letter{background:var(--red);color:#fff}
.opt.dim{opacity:.55}
.opt[disabled]{cursor:default}
.judge-opt{align-items:center}
.judge-opt .letter{border-radius:99px}
.confirm{margin:2px 0 10px}
.feedback{margin-top:8px;border-radius:12px;padding:13px 14px;font-size:14px;line-height:1.72;background:#f8fafc;border-left:4px solid var(--blue);animation:rise .18s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.feedback.ok{border-left-color:var(--green);background:#f0fdf4}
.feedback.bad{border-left-color:var(--red);background:#fef2f2}
.fb-title{font-weight:700;margin-bottom:5px}
.fb-title.ok{color:var(--green)}
.fb-title.bad{color:var(--red)}
.fb-exp{color:#334155;word-break:break-word;white-space:pre-wrap}
.fb-redo{margin-top:8px}
.fb-redo a{font-size:12.5px;color:var(--blue);text-decoration:none;border-bottom:1px dashed #93c5fd}
.actions{display:flex;gap:10px;margin-top:15px}
.btn{border:0;border-radius:11px;padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff;flex:1;font-family:inherit}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:#eef2ff;color:var(--blue-d)}
.btn.danger{background:#fee2e2;color:#b91c1c}
.empty{background:var(--card);border-radius:14px;padding:36px 18px;text-align:center;color:var(--muted);font-size:14px;box-shadow:0 1px 3px rgba(15,23,42,.06);line-height:1.8}
.wrong-head{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);padding:14px;border-radius:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.wrong-head strong{font-size:15px}
.wrong-head p{margin:3px 0 0;font-size:12px;color:var(--muted);line-height:1.5}
.wrong-head .btn{flex:0 0 auto;padding:10px 14px;font-size:13.5px}
.wrong-item{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;gap:10px;align-items:center;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.wi-main{flex:1;min-width:0;cursor:pointer}
.wi-stem{font-size:14px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.55}
.wi-meta{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
.wi-meta .x{color:#b91c1c}
.wi-meta .v{color:#15803d}
.wrong-item .go{flex:0 0 auto;border:0;background:#eef2ff;color:var(--blue-d);font-weight:700;font-size:13px;padding:8px 14px;border-radius:9px;cursor:pointer;font-family:inherit}
.note{font-size:13px;color:#334155;background:#eff6ff;border-left:4px solid #3b82f6;padding:10px 12px;border-radius:10px;margin-bottom:12px;line-height:1.65}
.subj-group{font-size:14.5px;font-weight:700;color:var(--blue-d);margin:18px 4px 8px;display:flex;align-items:center;gap:8px}
.subj-group .count{font-size:11.5px;color:var(--muted);font-weight:400}
.subj{background:var(--card);border-radius:14px;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.subj-head{width:100%;display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:13px 14px;text-align:left;cursor:pointer;font-family:inherit}
.stars{color:#f59e0b;font-size:11px;letter-spacing:1px;flex:0 0 auto}
.subj-head b{font-size:13px;color:var(--blue-d);flex:0 0 auto}
.subj-title{font-size:13.5px;font-weight:600;flex:1;min-width:0;line-height:1.45}
.chev{font-style:normal;color:var(--muted);transition:transform .2s;flex:0 0 auto}
.subj.open .chev{transform:rotate(180deg)}
.subj-body{display:none;padding:2px 14px 14px;font-size:13.5px;line-height:1.78;border-top:1px dashed var(--line);color:#1e293b}
.subj.open .subj-body{display:block}
.subj-body p{margin:8px 0}
.subj-body ol,.subj-body ul{margin:6px 0;padding-left:20px}
.subj-body li{margin:4px 0}
.subj-body strong{color:#0f172a}
.stat-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.stat-card{background:var(--card);border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.stat-card .num{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.stat-card .lab{font-size:12px;color:var(--muted);margin-top:2px}
.stat-table-wrap{background:var(--card);border-radius:14px;padding:4px 2px;box-shadow:0 1px 3px rgba(15,23,42,.06);overflow-x:auto}
.stat-table{width:100%;border-collapse:collapse;font-size:13.5px}
.stat-table th{color:var(--muted);font-weight:600;font-size:12px;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
.stat-table td{padding:10px 12px;border-bottom:1px solid #f1f5f9;font-variant-numeric:tabular-nums}
.stat-table tr:last-child td{border-bottom:0}
.danger-zone{margin-top:14px;background:var(--card);border-radius:14px;padding:14px;font-size:12.5px;color:var(--muted);line-height:1.7}
.danger-zone .btn{margin-top:10px;width:100%;padding:11px}
.foot{text-align:center;font-size:11.5px;color:#94a3b8;margin:22px 0 4px;line-height:1.8}
@media (min-width:600px){
  h1{font-size:20px}
  .stem{font-size:18px}
  .tab{font-size:14.5px;padding:10px 18px}
  .stat-cards{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>
<header>
  <div class="head-top">
    <div class="brand">
      <h1>数据中心运维（高级）工程师</h1>
      <p id="bankSub">考前刷题</p>
    </div>
    <div class="mini">
      <div class="mini-num" id="miniDone">0<span>/120</span></div>
      <div class="mini-lab">已答 · 正确率 <b id="miniAcc">—</b></div>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="practice">刷题</button>
    <button class="tab" data-tab="wrong">错题本<span class="dot" id="wrongCount" style="display:none">0</span></button>
    <button class="tab" data-tab="subjective">主观题</button>
    <button class="tab" data-tab="stats">统计</button>
  </nav>
</header>

<main>
  <section id="tab-practice" class="panel active">
    <div class="toolbar">
      <div class="chip-row bank-row" id="bankChips"></div>
      <div class="toolbar-2">
        <div class="chip-row" id="typeChips">
          <button class="chip active" data-type="all">全部</button>
          <button class="chip" data-type="single">单选</button>
          <button class="chip" data-type="multi">多选</button>
          <button class="chip" data-type="judge">判断</button>
        </div>
        <div class="chip-row" id="orderChips">
          <button class="chip active" data-order="seq">顺序</button>
          <button class="chip" data-order="rand">随机</button>
        </div>
      </div>
    </div>
    <div class="progress"><i id="progressFill"></i></div>
    <article class="qcard" id="qcard"></article>
  </section>

  <section id="tab-wrong" class="panel">
    <div class="wrong-head">
      <div>
        <strong id="wrongTitle">错题本</strong>
        <p id="wrongDesc">答错的题自动收录，重做答对后自动移出</p>
      </div>
      <button class="btn ghost" id="startWrong">错题重练</button>
    </div>
    <div id="wrongList"></div>
  </section>

  <section id="tab-subjective" class="panel">
    <div class="note">主观题按卷分组：考前冲刺为 6 道预测（按命中概率星级排序）；工信部操练卷为 5 道简答。点击卡片展开答题要点，作答建议「总—分—总」并点明标准依据。</div>
    <div id="subjList"></div>
  </section>

  <section id="tab-stats" class="panel">
    <div class="stat-cards" id="statCards"></div>
    <div class="stat-table-wrap">
      <table class="stat-table">
        <thead><tr><th>题型</th><th>题量</th><th>已答</th><th>答对</th><th>正确率</th></tr></thead>
        <tbody id="statBody"></tbody>
      </table>
    </div>
    <div class="danger-zone">
      进度仅保存在本机浏览器（localStorage），不上传服务器；清除浏览器数据会丢失进度。重置将清除全部卷组的进度。
      <button class="btn danger" id="resetAll">重置全部进度</button>
    </div>
    <footer class="foot">依据「数据中心运维管理（高级）工程师」培训教材与工信部运维认证模块一模拟操练卷整理 · 仅供个人备考<br>题目与答案以正式考试要求为准</footer>
  </section>
</main>

装置。（　）","options":["正确","错误"],"answer":"T","explain":"（限压型SPD之间小于5m时同样加装；SPD具备能量自动配合功能时不受限制）（D1-P46）","source":"D1-P46","id":"j28"},{"type":"judge","stem":"锂离子电池室的可燃气体报警联动阈值不应高于可燃气体爆炸下限的25%。（　）","options":["正确","错误"],"answer":"F","explain":"（联动阈值不高于爆炸下限10%；室内浓度不超爆炸下限25%）（D1-P48）","source":"D1-P48","id":"j29"},{"type":"judge","stem":"锂离子电池宜部署在室外或独立建（构）筑物。（　）","options":["正确","错误"],"answer":"T","explain":"（部署在同一建筑内时须设独立电池室并满足系列要求）（D1-P47）","source":"D1-P47","id":"j30"},{"type":"judge","stem":"两票三制中的\"三制\"是指交接班制、巡回检查制、设备定期试验轮换制。（　）","options":["正确","错误"],"answer":"T","explain":"（D2-P41）","source":"D2-P41","id":"j31"},{"type":"judge","stem":"CT二次侧严禁短路，PT二次侧严禁开路。（　）","options":["正确","错误"],"answer":"F","explain":"（正好相反：CT二次严禁开路、PT二次严禁短路）（D2-P38）","source":"D2-P38","id":"j32"},{"type":"judge","stem":"数据中心事故约60%源于二次回路。（　）","options":["正确","错误"],"answer":"T","explain":"（D2-P38）","source":"D2-P38","id":"j33"},{"type":"judge","stem":"机房精密空调和舒适空调一样采用小风量、大焓差设计。（　）","options":["正确","错误"],"answer":"F","explain":"（精密空调大风量、小焓差；舒适空调才是小风量、大焓差）（D2-P47）","source":"D2-P47","id":"j34"},{"type":"judge","stem":"提高冷冻水供水温度、降低冷却水温度，会使冷水机组COP提高。（　）","options":["正确","错误"],"answer":"T","explain":"（这是冷却塔要清洗、水温取32/37℃与12/17℃的原因）（D2-P48）","source":"D2-P48","id":"j35"},{"type":"judge","stem":"数据中心IT设备宜由不间断电源系统供电，且UPS基本容量应留有余量E≥1.2P。（　）","options":["正确","错误"],"answer":"T","explain":"（D2-P24）","source":"D2-P24","id":"j36"},{"type":"judge","stem":"A级机房测试验证可以用部分真实IT负载代替假负载。（　）","options":["正确","错误"],"answer":"F","explain":"（测试负载应使用假负载Load Bank，不得直接用真实IT负载）（D2-P70）","source":"D2-P70","id":"j37"},{"type":"judge","stem":"柴油发电机每周空载试启动即可，无需带载测试。（　）","options":["正确","错误"],"answer":"F","explain":"（行业统计约30%柴发事故发生在真实停电时；GB50462-2024要求每年至少1次100%满载带载测试）（D2-P36、71）","source":"D2-P36","id":"j38"},{"type":"judge","stem":"智算中心（AIDC）供电架构正在从UPS向高压直流、市电直供＋储能方向演进。（　）","options":["正确","错误"],"answer":"T","explain":"（断电容忍度从秒级变为毫秒级、checkpoint不可丢失）（D2-P78）","source":"D2-P78","id":"j39"},{"type":"judge","stem":"2025年6月某智算中心32节点GPU集群掉电事故的直接原因是列头柜断路器接线端子松动发热脱扣。（　）","options":["正确","错误"],"answer":"T","explain":"（损失超200万元；整改含端子力矩复紧一年一次、70℃自动告警）（D2-P83）","source":"D2-P83","id":"j40"}],"subjective":[{"no":"一","stars":5,"title":"试述通算中心、智算中心、超算中心的主要区别","body":"**答题要点**（按 D1-P7 对比表展开，至少答出 8 个维度，每个维度三列对比+收尾）：\n\n1. **建设目的**：通算帮助用户降本增效或提升盈利水平；智算促进 AI 产业化、产业 AI 化、政府治理智能化；超算面向科研人员和科学计算场景提供支撑，提升国家及地方自主科研创新能力。\n2. **建设标准**：通算已有 GB50174、GB50462、GB/T51314 等十多项国家标准；智算已有 GB/T 48097-2026、GB/T 48023-2026 两项液冷标准，其余在编；超算没有国家标准，仅有团体标准《超级计算数据中心设计要求》T/CCUA016-2021。\n3. **具体功能**：通算以更低成本满足个性化、规模化业务应用需求；智算是算力生产供应平台、数据开放共享平台、智能生态建设平台、产业创新聚集平台；超算重点支持大规模科学计算和工程计算任务。\n4. **应用领域**：通算应用领域广泛且不断扩张；智算面向 AI 典型场景（知识图谱、自然语言处理、智能制造、自动驾驶、智慧农业、防洪减灾）；超算面向基础学科研究、工业制造、生命医疗、模拟仿真、气象环境、天文地理。\n5. **实时性**：通算高、智算高（较高）、超算低。\n6. **可靠性**：通算高、智算较高、超算较高。\n7. **功率密度**：通算低、智算高、超算高。\n8. **承重**：通算较高、智算较高（高）、超算高。\n9. **网络带宽**：通算较高、智算高、超算较高。\n10. **冷却方式**：通算风、水；智算风、水、液；超算水、液。\n11. **数据来源**：通算人工＋传感器；智算传感器＋计算机；超算计算机。\n12. **建设模式比喻**：通算\"盖房待客\"（先建后招租），智算、超算\"按客盖房\"（按业务定制）。\n\n**收尾（提分点）**：三类中心并非割裂，随着 AI 算力需求爆发，智算中心占比逐年增加，正在从\"算力设施\"向\"AI 工厂（词元工厂）\"演进，基础设施呈现液冷、高密度供电、高速网络、智能化运维四大特征；算力中心标准体系正沿全生命周期、通算/智算/超算分类、四级标准（国家/行业/地方/团体）三个维度加快完善。"},{"no":"二","stars":4,"title":"简述《数据中心设计标准》GB/T 50174-202X 相比 2017 版的主要修订内容","body":"**答题要点**（D1-P15-16，15条归纳为9点背诵）：\n\n1. **总体框架**：标准共 13 章 5 个附录，主要内容含总则、术语和缩略语、基本规定、项目组成及工艺平面布置、建筑与结构、制冷与空调、给水排水、电气、智能化、网络与布线、电磁屏蔽、消防与安全、资源能源利用与环境保护。\n2. **第1章总则**：明确适用于陆地新建、改建和扩建各类数据中心共性和基本技术要求。\n3. **新增第3章\"基本规定\"**：增加\"建设要求\"小节，将选址与设备布置、分级与性能要求、环境要求纳入；**新增\"容灾备份要求\"**，提出灾备数据中心和增强型数据中心设计要求（同城电源来自不同变电站、距离≥10km；异地不同地震带、≥100km）。\n4. **第4章面积与布置**：调整主机房区使用面积计算参数与支持区/辅助区面积倍数（辅助区和支持区面积之和由主机房1.5~2.5倍放宽至1.5~5倍），补充通道与设备间距要求（含液冷机柜间距）；AI 和高性能计算主机房宜集中布置。\n5. **第5章建筑结构**：修订部分荷载取值，增加楼面活荷载设计折减系数，补充抗震要求。\n6. **第6章由\"空气调节\"改为\"制冷与空调\"**：增加不同等级数据中心制冷与空调系统架构要求，按空调系统、冷冻水、冷却水、直膨、热管、间接蒸发冷却、液冷系统分别提出设计要求。\n7. **第7~9章机电**：给水排水增加蒸发冷却补水和水质要求；电气增加负荷计算、直流供配电系统及电能质量要求、细化分级供配电架构；智能化补充控制系统架构及供电要求与液冷控制要求，\"安全防范系统\"更名为\"**电子防护系统**\"，新增电力监控系统、数据中心基础设施管理系统（DCIM）、基础设施网络安全要求。\n8. **第10~12章**：网络与布线增加并行计算网络布线和液冷线缆要求；电磁屏蔽修改结构形式并补充屏蔽机房；消防与安全从本质安全角度统一防火疏散与消防设施要求，**新增液冷数据中心、锂离子电池相关消防及安全设计要求**。\n9. **第13章及附录**：新增\"资源能源利用与环境保护\"章（节能与可再生能源、节水、降碳、环保）；附录A修改选址、温湿度、活荷载、供回水温度、主用电源、UPS蓄电池备用时间等参数，增加液冷、连续供冷、直流UPS、锂电池室消防要求；新增附录B冷通道/液冷机房温湿度范围、附录C冷板式液冷冷却液参数、附录D浸没式液冷冷却液参数、附录E CDU冷源侧冷却介质参数。"},{"no":"三","stars":4,"title":"不间断电源系统采用锂离子电池时，电池室设计应符合哪些要求？","body":"**答题要点**（D1-P47-48，先答总原则再逐条）：\n\n**总原则**（12.1.8）：锂离子电池宜部署在**室外或独立建（构）筑物**；当与数据中心其他区域部署在同一建筑内时，应设置**独立的电池室**。\n\n**布置要求**：\n1. 靠外墙设置，不应位于经常有人停留房间的上/下一层或贴邻，**不应贴邻疏散楼梯间**；\n2. 外窗净高和净宽**均不小于1.0m**，采用易于从室内外打开或破拆的安全玻璃；\n3. 宜设置在**24m以下楼层**，**不应设置在地下室或半地下室**；\n4. 每个电池室装设容量**不宜大于600kWh**。\n\n**防火分隔**：采用**耐火极限不低于4.00h的防火隔墙**和**不低于2.00h的楼板**与其他区域分隔，门采用**甲级防火门**；管线穿过隔墙楼板时空隙用不燃材料封堵密实。\n\n**消防与监控**：\n1. 电池柜应设置**电池柜级或模块级消防装置**；\n2. 自动灭火系统应具备**有效灭火和持续抑制复燃**性能，喷水灭火按**严重危险级Ⅰ级**设计并设独立机械排烟；\n3. 感烟/感温探测器、照明、通风排烟设备采用**防爆型**；\n4. 设置**可燃气体探测报警系统**（宜氢气、一氧化碳或组合式探测器），接入消防控制室；\n5. 设置具备数据采集、通信、报警保护、均衡和绝缘失效检测功能的**电池管理系统（BMS）**，具备**热失控监测报警**，数据实时上传消防控制室或总控中心。\n\n**通风联动**：通风系统与可燃气体报警联动，**联动阈值不高于爆炸下限10%**（氢气爆炸下限约4%VOL，即0.4%VOL报警）；**换气次数不少于12次/h**；室内可燃气体浓度**不超过爆炸下限25%**；通风手动控制装置室内外分别设置。\n\n**联系实际（提分点）**：2025年9月韩国国情院大田数据中心UPS锂电池火灾（22小时、647个政府系统中断）和2024年新加坡数据中心锂电池间火灾（36小时无法进入）表明，锂电池热失控复燃性强、危害大，上述条款是液冷智算时代供电安全的底线要求。"},{"no":"四","stars":4,"title":"试述数据中心的分级体系及各级配置要求","body":"**答题要点**（D1-P23 + D2-P9-10、P30）：\n\n1. **国标分级（GB50174）**：数据中心基础设施分为A、B、C三级，等级由高到低：\n   - **C级**：按基本要求配置，满足电子信息设备安全运行的基本要求；\n   - **B级**：除满足C级要求外，**供配电、智能化、冷却与空调、网络布线、给水**等系统的设备或管线按**冗余**要求配置，冗余配置应满足电子信息设备运行要求；\n   - **A级**：除满足B级要求外，**供配电、冷却与空调、网络布线、给水**等系统按**容错**要求配置——当一个系统发生故障或进行检修时，电子信息设备正常运行。\n2. **国际分级**：美国 TIA-942 分 Tier/Rated Ⅰ~Ⅳ（基本、冗余组件、可同时维护/并行维护、容错）；Uptime Institute Tier Ⅰ基本能力、Ⅱ冗余组件、Ⅲ并行维护、Ⅳ容错；Tier Ⅳ 要求多路径全活跃、分区化（变压器室、发电机房、UPS室、电池室、冷水机房、电信入口物理隔离，不共享PDU、灭火和冷却）。\n3. **分级使用原则**：\n   - 各组成部分按不同等级设计时，数据中心建设等级按**最低建设等级**确定（3.3.2）；\n   - 多中心互为备份、数据实时传输、业务满足连续性时，可按容错**也可按冗余**配置（3.3.3）；\n   - 可结合业务差异化需求提高配置，兼顾**技术可靠性、建设经济性与TCO**（3.3.4）；冗余选择依据是**停机时间成本、风险容忍度、预算**。\n4. **冗余度数学表达**（联系第二三天教材）：N（无冗余）、N+1（任一单元故障不中断）、2N（两个完整独立系统，UPS单机利用率50%）、2(N+1)等。"},{"no":"五","stars":3,"title":"结合事故案例，论述数据中心（算力中心）面临的压力与应对措施","body":"**答题要点**（D1-P4-5 + 安全框架 + 趋势）：\n\n1. **五大压力**：①安全运行重要性显著增加；②电力缺乏越来越明显（美国拟建算力项目电网接入排队3~7年）；③信创压力（国产化率提高）；④监管压力（绿色低碳、窗口指导）；⑤更新压力（芯片技术发展快、基础设施配套紧跟）。\n2. **三起典型事故**：新加坡罗央大道数据中心锂电池间火灾（36小时无法进入）；韩国国情院大田数据中心UPS锂电池火灾（22小时、242名消防员、384个电池组烧毁、647个政府系统中断、96个完全烧毁）；广州南沙IDC冷却系统BA故障（冷冻水泄漏、宕机12小时、P0级、损失超亿元）。\n3. **应对与趋势**：八大发展趋势（大型化、微型化、模块化、高密度液冷、专业化、绿色低碳、自动化智能化、高安全）；总体安全=实体安全+边界安全+内在安全；落实\"一体化算力网\"与能效标准（GB40879能效等级、项目规范PUE/WUE限额）；AI参与运维是必然但要注意风险。\n4. **联系本职（提分点）**：可结合韶关算力中心现场运维实践（超节点液冷巡检、动环监控告警闭环、应急演练）说明\"设计冗余、交付验证、运维演练、根因分析\"四位一体。"},{"no":"六","stars":3,"title":"AIDC（智算中心）给基础设施运维带来了哪些新挑战？如何应对？","body":"**答题要点**（D2-P78-85）：\n\n1. **本质变化**：单机柜功率从 3~8kW 跃升至 30~100kW+，供电架构向高压直流/市电直供＋储能演进，断电容忍度从秒级变为**毫秒级、checkpoint 不可丢**，故障损失从万元级升至百万~千万元级（32节点集群案例损失超200万）。\n2. **四个新命题**：词元工厂化（运维对象升级为生产系统）；算电协同化（电费占比超50%，峰谷调度、绿电消纳）；液冷常态化（新增漏液、流量、水质三类故障域）；效能优先化（PUE、利用率、词元产出效率三指标并行）。\n3. **液冷防护**：四层防护体系——源头防漏（快接头自密封）、检测发现（漏水绳/液位传感器）、自动隔离（电磁阀快速关断）、导流防护（机柜托盘、导流槽）；检测布点在CDU底部、管路接头下方、机柜托盘、地板下四处。\n4. **测试验证**：A级机房须完成 ICT 综合测试（假负载满载、市电中断、UPS切换、柴发带载模拟），每年至少1次满载黑启动演练。\n5. **方法论**：RCA根因分析（5 Whys＋鱼骨图人机料法环测六维），如阿里云香港案例五问挖到\"交付时未做满负荷综合测试\"。\n6. **收尾金句**：数据中心基础设施\"平时看不见、出事就是大事\"——设计冗余、交付验证、运维演练、根因分析，四件事一件都不能少。\n\n---\n\n**最后提示**：\n- 客观题遇到精确数字拿不准时，优先回忆\"速记总表\"里加粗的锚点值；\n- 多选题宁缺勿滥，但\"全选型\"考题（趋势类、体系类）在本教材中出现频率高；\n- 判断题注意\"严禁/不宜/应/宜\"等措辞偷换（如TN-C、CT开路、A级含智能化、限定值=3级）；\n- 主观题按\"总—分—总\"结构作答，先亮结论/框架，再分条展开，每条点明标准依据（GB50174、项目规范、GB40879等），最后结合工程实际收尾。"}]},{"id":"miit","name":"工信部操练卷（模块一）","singles":[{"id":"g-s1","type":"single","stem":"根据GB 50174-2017《数据中心设计规范》，数据中心划分为几个等级？","options":["两个等级","三个等级","四个等级","五个等级"],"answer":"B","source":"GB 50174-2017","explain":"GB 50174-2017 将数据中心按基础设施可靠性划分为 A、B、C 三个等级：A级容错、B级冗余、C级基本要求，等级由高到低。注意与 TIA-942/Uptime 的四级（Tier Ⅰ~Ⅳ）区分，不要混淆。"},{"id":"g-s2","type":"single","stem":"A 级数据中心的基础设施应按以下哪种方式配置？","options":["基本需求配置","冗余要求配置","容错系统配置","单路供电配置"],"answer":"C","source":"GB 50174-2017","explain":"A级按容错要求配置——当任一系统发生故障或检修时，电子信息设备仍正常运行；B级为冗余配置；C级为基本要求配置。A级容错覆盖供配电、冷却与空调、网络布线、给水四大系统（注意不含智能化，智能化仅列入B级冗余范围）。"},{"id":"g-s3","type":"single","stem":"GB 50462-2024《数据中心基础设施施工及验收标准》自哪天起实施？","options":["2024年5月8日","2024年7月1日","2024年9月1日","2025年1月1日"],"answer":"C","source":"住建部公告","explain":"GB 50462-2024 于 2024年5月8日 发布（A为发布日期干扰项），自 2024年9月1日 起实施，同时废止 GB 50462-2015。依据住房和城乡建设部发布公告。"},{"id":"g-s4","type":"single","stem":"以下哪个标准是数据中心能效方面的强制性国家标准？","options":["GB/T 44989-2024","GB 40879-2021","GB 50174-2017","GB 50462-2024"],"answer":"B","source":"GB 40879-2021","explain":"GB 40879-2021《数据中心能效限定值及能效等级》为强制性国家标准（GB 不带 /T），规定电能比（PUE）三级能效：设计值 1.15/1.25/1.40，能效限定值即 3 级。GB/T 44989-2024 为推荐性绿色评价标准；GB 50174-2017 为设计规范；GB 50462-2024 为施工验收标准。"},{"id":"g-s5","type":"single","stem":"与传统数据中心相比，智算中心最直观的代差体现在以下哪个方面？","options":["占地面积更大","单机柜功率密度更高","运维人员更少","建设成本更低"],"answer":"B","source":"教材D2-P78","explain":"从 IDC 到 AIDC，单机柜功率从 3~8kW 跃升至 30~100kW+，由此带来液冷、承重、供配电、层高等一系列基础设施重构——这是最直观的代差标志（培训教材第二三天 P78）。"},{"id":"g-s6","type":"single","stem":"GB 50462-2024 中，以下哪两条为强制性条文，必须严格执行？","options":["第3.1.6条和第4.2.5条","第5.2.10条和第5.2.11条","第7.1.3条和第8.2.1条","第10.1.1条和第12.2.5条"],"answer":"B","source":"住建部公告","explain":"住建部公告明确：GB 50462-2024 中第 5.2.10、5.2.11 条为强制性条文，必须严格执行。培训教材亦提到该两条强条由《数据中心项目规范》衔接管理。"},{"id":"g-s7","type":"single","stem":"根据GB 50174-2017，数据中心宜由主机房、辅助区、支持区和以下哪个功能区组成？","options":["设备区","行政管理区","仓储区","生活区"],"answer":"B","source":"GB 50174-2017","explain":"数据中心宜由主机房、辅助区、支持区和行政管理区四大部分组成；《数据中心项目规范》2.2.1 同样按主机房区、辅助区、支持区和行政管理区布置。辅助区+支持区面积之和可取主机房的 1.5~2.5 倍。"},{"id":"g-s8","type":"single","stem":"关于智算中心与传统数据中心的差异，以下说法错误的是（　）","options":["智算中心以GPU、FPGA、ASIC 等 AI 芯片为主要算力来源","传统数据中心主要承担数据存储和事务性处理任务","智算中心对网络性能的要求低于传统数据中心","智算中心具有高算力、大存力、高运力等特征"],"answer":"C","source":"教材D1-P7","explain":"选错误项。智算中心对网络性能要求显著更高：集群高速互联（NVLink、IB、RoCE、800G/1.6T 参数面网络）直接决定训练效率，C 说反了。A、B、D 均为正确表述。"},{"id":"g-s9","type":"single","stem":"以下哪个场景最应建设A 级数据中心？","options":["企业内部培训系统","银行核心交易系统","公司门户网站","部门级文件服务器"],"answer":"B","source":"GB 50174-2017","explain":"分级依据是使用性质及数据丢失或网络中断造成的损失或影响程度。银行核心交易系统一旦中断将造成重大经济损失与社会影响，应按 A 级（容错）建设；培训系统、门户网站、部门级文件服务器等非关键业务可按 B 级或 C 级建设。"},{"id":"g-s10","type":"single","stem":"GB 50462-2024 与GB 50462-2015 相比，新增了以下哪项技术要求？","options":["防雷接地系统","综合布线系统","微模块和集装箱数据中心技术要求","空调系统施工要求"],"answer":"C","source":"GB 50462-2024","explain":"2024 版相对 2015 版的核心新增：微模块与集装箱数据中心技术要求（对应模块化、预制化建造趋势），另强化 7 度及以上抗震设防区 A 级数据中心的减隔震要求等。防雷接地、综合布线、空调系统 2015 版即有。"}],"multis":[{"id":"g-m1","type":"multi","stem":"以下哪些属于算力中心（含智算中心）的特征？","options":["高算力密度","低能耗","高散热需求","功率波动大"],"answer":"ACD","source":"教材D1/D2","explain":"算力/智算中心特征：高算力密度、高散热需求（风冷难以为继、需液冷）、功率随训练/推理负载大幅波动（柴发与UPS容量需重新复核）。\"低能耗\"错误——智算中心是高能耗设施，追求的是更低 PUE 而非低能耗。"},{"id":"g-m2","type":"multi","stem":"根据中国信息通信研究院的研究，智算中心与传统数据中心相比，具有以下哪些特征？","options":["高算力","大存力","高运力","低安全"],"answer":"ABC","source":"信通院","explain":"信通院口径：智算中心具有\"高算力、大存力、高运力\"三大特征。\"低安全\"错误——智算中心安全要求反而更高（算力中心安全是永恒主题，总体安全=实体安全+边界安全+内在安全）。"},{"id":"g-m3","type":"multi","stem":"GB 50174-2017 中，数据中心的分级依据包括以下哪些？","options":["数据中心的建筑面积","数据中心的使用性质","数据丢失或网络中断造成的损失或影响程度","数据中心的建设投资规模"],"answer":"BC","source":"GB 50174-2017","explain":"分级依据＝使用性质＋数据丢失或网络中断造成的损失或影响程度，与面积、投资规模无关。"},{"id":"g-m4","type":"multi","stem":"以下关于GB 50462-2024 的说法，正确的有（　）","options":["由住房和城乡建设部批准发布","由工业和信息化部主编","替代了GB 50462-2015","仅适用于新建数据中心"],"answer":"ABC","source":"住建部公告","explain":"A正确：由住建部批准、与国家市场监督管理总局联合发布（2024-05-08发布）；B正确：该系列标准行业归口/主编为工业和信息化部（具体编制单位为中国电子技术标准化研究院、中国机房设施工程有限公司等）；C正确：原 GB 50462-2015 同时废止；D错误：适用于新建、改建和扩建数据中心，且不限规模。"},{"id":"g-m5","type":"multi","stem":"与传统数据中心相比，智算中心在以下哪些方面存在显著差异？","options":["计算架构","网络架构","存储架构","建筑外观"],"answer":"ABC","source":"教材D2-P81","explain":"计算架构：CPU通用计算→GPU/NPU等异构AI计算；网络架构：Scale-Up（NVLink/灵衢）+Scale-Out（IB/RoCE）高速互联；存储架构：NVMe全闪存\"近算力\"存储。建筑外观不构成本质差异。"},{"id":"g-m6","type":"multi","stem":"根据GB 50174-2017，A 级数据中心在供配电方面应满足以下哪些要求？","options":["两路独立市电","双路UPS 冗余","柴油发电机","单路市电供电"],"answer":"ABC","source":"GB 50174-2017","explain":"A级供配电按容错配置：两个电源不应同时受到损坏（双重电源宜来自不同变电站）＋独立的柴油发电机组备用电源；UPS 按容错（2N）配置。\"单路市电\"与容错原则相悖。"},{"id":"g-m7","type":"multi","stem":"我国数据中心国家标准体系中，以下哪些属于绿色数据中心相关标准？","options":["GB/T 44989-2024《绿色数据中心评价》","GB 40879-2021《数据中心能效限定值及能效等级》","《数据中心资源利用》系列标准","GB 50174-2017《数据中心设计规范》"],"answer":"ABC","source":"教材D1-P9","explain":"绿色标准包括：《绿色数据中心评价》GB/T 44989-2024、《数据中心能效限定值及能效等级》GB 40879-2021、GB/T 32910《数据中心资源利用》系列（电能能效、可再生能源利用率、水资源使用效率等）等。GB 50174-2017 属设计规范类。"},{"id":"g-m8","type":"multi","stem":"GB 50462-2024 的主要技术内容包括以下哪些？","options":["配电系统","防雷与接地系统","空调系统","微模块"],"answer":"ABCD","source":"GB 50462-2024","explain":"GB 50462-2024 主要技术内容：总则、术语、基本规定、室内装饰装修、配电系统、防雷与接地系统、空调系统、微模块（及集装箱数据中心）等，覆盖数据中心基础设施施工验收全过程——四项全选。"},{"id":"g-m9","type":"multi","stem":"以下关于数据中心分级与典型应用场景的对应关系，正确的有（　）","options":["A级——金融行业核心系统","B级——一般企业级数据中心","C级——国家级信息中心","A级——电信运营商核心机房"],"answer":"ABD","source":"GB 50174-2017","explain":"A级（容错）：金融核心交易、电信运营商核心机房、国家级信息中心等关键业务；B级（冗余）：一般企业级数据中心；C级（基本）：企业内部非关键系统（培训系统、部门级文件服务器等）。C选项\"国家级信息中心\"应对应A级，故错误。"},{"id":"g-m10","type":"multi","stem":"关于智算中心运维与传统数据中心运维的差异，以下说法正确的有（　）","options":["智算中心运维需掌握异构算力知识","智算中心运维对人员复合型能力要求更高","传统数据中心运维与智算中心运维要求完全相同","智算中心运维需掌握算力网络和调度平台知识"],"answer":"ABD","source":"教材D2-P80","explain":"智算运维四大新命题：词元工厂化、算电协同化、液冷常态化、效能优先化；要求掌握异构算力（GPU/NPU/ASIC）、液冷系统（漏液/流量/水质）、算力网络与调度平台等复合技能。\"完全相同\"说法错误。"}],"judges":[{"id":"g-j1","type":"judge","stem":"GB 50174-2017 是我国数据中心设计领域的核心国家标准。","options":["正确","错误"],"answer":"T","source":"GB 50174-2017","explain":"正确。GB 50174-2017 是数据中心设计领域的基础性、核心国家标准，配套 GB 50462（施工验收）、GB/T 51314（运维）构成全生命周期主干标准；新版 GB/T 50174-202X 正在修订。"},{"id":"g-j2","type":"judge","stem":"智算中心的单机柜功率密度与传统数据中心基本相同，都在4kW 到8kW 之间。","options":["正确","错误"],"answer":"F","source":"教材D2-P78","explain":"错误。传统数据中心单机柜 3~8kW；智算中心 30~100kW+，超节点整机柜功率更高（NVL72 达 132kW），配套液冷、承重、供配电全面升级。"},{"id":"g-j3","type":"judge","stem":"GB 50462-2024 中第5.2.10 条和第5.2.11 条为推荐性条文。","options":["正确","错误"],"answer":"F","source":"住建部公告","explain":"错误。住建部公告明确第 5.2.10、5.2.11 条为强制性条文，必须严格执行。"},{"id":"g-j4","type":"judge","stem":"数据中心竣工验收应按设计等级进行符合性验收。","options":["正确","错误"],"answer":"T","source":"GB 50462-2024","explain":"正确。施工及验收应与设计等级一致：A级机房须完成综合测试（ICT）——满负荷带载、市电中断模拟、UPS切换模拟、柴发启动带载模拟；测试不通过不得投入运行（GB 50462-2024 强制要求）。"},{"id":"g-j5","type":"judge","stem":"A 级数据中心可以采用单路市电加单台UPS 的供电方案。","options":["正确","错误"],"answer":"F","source":"GB 50174-2017","explain":"错误。A级为容错配置：双重电源（不应同时受到损坏，宜来自不同变电站）＋独立柴油发电机组＋UPS容错（2N）。单路市电加单台UPS连冗余都不满足，更谈不上容错。"},{"id":"g-j6","type":"judge","stem":"智算中心主要依靠风冷散热即可满足高密度算力设备的散热需求。","options":["正确","错误"],"answer":"F","source":"教材D1/D2","explain":"错误。30kW+ 机柜风冷已到极限，需风液混合或冷板液冷为主（NVL72 风液比 8.5:1.5，未来液冷占比更高）；浸没式液冷散热能力约为风冷的 10 倍。"},{"id":"g-j7","type":"judge","stem":"聚焦绿色数据中心领域，我国已规划标准175 项，正式发布国家和行业标准46 项。","options":["正确","错误"],"answer":"T","source":"课程口径","explain":"按课程口径判断为正确（工信部绿色数据中心标准体系工作数据：已规划175项、发布国家和行业标准46项）。注：该数字出自操练卷对应课程讲义，公开渠道未见同口径表述，如讲义数字不同以讲义为准。"},{"id":"g-j8","type":"judge","stem":"GB 50462-2024 仅适用于大型数据中心，不适用于中小型数据中心。","options":["正确","错误"],"answer":"F","source":"GB 50462-2024","explain":"错误。适用于新建、改建和扩建的各规模数据中心的施工及验收，不区分大中小型。"},{"id":"g-j9","type":"judge","stem":"根据GB 50174-2017，数据中心与其他功能用房之间应采用耐火极限不低于2.0h 的防火隔墙和1.5h 的楼板隔开。","options":["正确","错误"],"answer":"T","source":"GB50174-2017 13.2.4","explain":"正确。第13.2.4条：当数据中心与其他功能用房在同一建筑内时，应采用耐火极限不低于2.0h的防火隔墙和1.5h的楼板隔开，隔墙上开门应采用甲级防火门。该条原为强制性条文，现已由《数据中心项目规范》承接。"},{"id":"g-j10","type":"judge","stem":"GB/T 44989-2024《绿色数据中心评价》确立了绿色数据中心评价等级，规定了评价指标和评价方法。","options":["正确","错误"],"answer":"T","source":"GB/T 44989-2024","explain":"正确。GB/T 44989-2024 确立绿色数据中心评价等级（等级越高绿色水平越高），规定能源资源利用效率、绿色低碳等评价指标体系与评价方法，是绿色数据中心评价的核心推荐性国家标准。"}],"subjective":[{"no":"1","stars":0,"title":"简述GB 50174-2017 中A、B、C 三个等级数据中心的划分依据及其各自的核心配置要求","body":"**划分依据**（两条）：\n1. 数据中心的使用性质；\n2. 数据丢失或网络中断造成的损失或影响程度。\n\n**各级核心配置要求**：\n1. **C级——基本要求配置**：满足电子信息设备安全运行的基本要求。\n2. **B级——冗余要求配置**：除满足C级外，供配电、智能化、冷却与空调、网络布线、给水等系统的设备或管线按冗余要求配置。\n3. **A级——容错要求配置**：除满足B级外，供配电、冷却与空调、网络布线、给水等系统按容错要求配置——任一系统发生故障或检修时电子信息设备正常运行（供配电对应双重电源+独立柴发+UPS容错）。\n\n**补充**：不同部分按不同等级设计时，数据中心整体建设等级按最低等级确定；两个及以上数据中心互为备份、数据实时传输且业务满足连续性时，可按容错也可按冗余配置。"},{"no":"2","stars":0,"title":"从至少三个维度阐述传统数据中心与智算中心的主要差异","body":"**1. 计算架构与算力来源**：传统以CPU通用计算为主，承担数据存储与事务处理；智算以GPU、FPGA、ASIC等AI芯片异构加速平台为主，承担训练与推理。\n\n**2. 机柜功率密度与制冷**：传统3~8kW、风冷+冷通道封闭即可；智算30~100kW+，必须风液混合或冷板/浸没式液冷，承重、层高、配电同步重构。\n\n**3. 网络架构**：传统以太网为主；智算需要Scale-Up（NVLink/灵衢）超节点互联+Scale-Out（IB/RoCE）集群网络，参数面迈向800G/1.6T。\n\n**4. 运维要求**：传统运维相对标准化；智算新增液冷（漏液/流量/水质）、异构算力、算电协同、checkpoint保护等复合能力要求，故障损失从万元级升至百万元级。\n\n**5. 能耗与指标**：传统PUE目标1.5~1.8；智算先进项目PUE≤1.25（甚至≤1.15），并叠加算力利用率指标。（答出任意3个维度即可，建议补充\"高算力、大存力、高运力\"特征收尾。）"},{"no":"3","stars":0,"title":"简述GB 50462-2024 的主要修订内容及实施时间","body":"**实施时间**：2024年5月8日发布，自 **2024年9月1日** 起实施；原 GB 50462-2015 同时废止。\n\n**主要修订内容**：\n1. **新增微模块与集装箱数据中心技术要求**，适应模块化、预制化建造趋势；\n2. **强化抗震要求**：7度及以上抗震设防区A级数据中心强化减隔震措施；\n3. **强制性条文调整**：第5.2.10、5.2.11条为强制性条文，必须严格执行（与《数据中心项目规范》衔接）；\n4. **强化按设计等级的符合性验收**：A级机房须完成综合测试（ICT）——假负载满负荷带载、市电中断模拟、UPS切换模拟、柴发启动带载模拟，测试数据存档作为竣工验收依据，测试不通过不得投运；\n5. 适用范围覆盖新建、改建和扩建数据中心。\n\n（依据住建部公告及培训教材第二三天 P70）"},{"no":"4","stars":0,"title":"列举我国数据中心国家标准体系中至少五类主要标准，并简要说明其作用","body":"1. **设计类**：GB 50174-2017《数据中心设计规范》——规定分级、选址、建筑、机电、消防等设计要求，设计领域核心标准；\n2. **施工验收类**：GB 50462-2024《数据中心基础设施施工及验收标准》——规定施工质量与竣工验收要求（含ICT综合测试）；\n3. **运维类**：GB/T 51314-2018《数据中心基础设施运行维护标准》——规范运行维护组织、制度与流程；\n4. **能效类**：GB 40879-2021《数据中心能效限定值及能效等级》——强制限定PUE（3级=限定值），引导节能；\n5. **绿色评价类**：GB/T 44989-2024《绿色数据中心评价》——确立绿色评价等级、指标与方法；\n6. **资源利用类**：GB/T 32910系列《数据中心资源利用》（术语、关键性能指标、电能能效、可再生能源利用率、水效率）；\n7. **模块化/预制化类**：GB/T 41783《模块化数据中心通用规范》、GB/T 36448《集装箱式数据中心机房通用规范》；\n8. **液冷类（智算）**：GB/T 48023-2026《数据中心冷板式液冷系统技术规范》、GB/T 48097-2026《数据中心冷板式液冷机柜通用规范》。\n（答出5类即可，每类给出标准号+作用。）"},{"no":"5","stars":0,"title":"简述我国数据中心标准体系的建设现状及其对行业发展的意义","body":"**建设现状**：\n1. **通算中心标准基本完善**：覆盖规划设计、施工验收、检测评估、运行维护全生命周期（GB 50174、GB 50462、GB/T 51314、GB 40879、GB/T 44989、GB/T 32910系列等）；\n2. **强制规范落地**：《数据中心项目规范》79条强制性条文发布，确立规模划分与PUE/WUE硬约束；\n3. **智算标准起步**：已颁布冷板式液冷两项国标（GB/T 48023/48097-2026），《算力设施工程技术标准》《绿色算力基础设施技术要求》等在编；\n4. **超算标准缺乏**：仅有团体标准（T/CCUA 016-2021）；\n5. 绿色低碳标准加快完善（绿色数据中心领域已规划标准175项、发布国家和行业标准46项）。\n\n**对行业的意义**：\n1. 统一建设与运维的技术底线，保障数据中心安全、可靠、稳定运行；\n2. 以强制规范与能效等级引导绿色低碳发展，支撑双碳目标；\n3. 规范智算中心高密度、液冷新技术应用，降低技术与质量风险；\n4. 促进全国一体化算力网建设与互联互通；\n5. 提升建设运维质量与国际竞争力，支撑数字经济与AI产业发展。"}]}]};

const BANKS = DATA.banks;
const TYPE_NAME = { single: '单选题', multi: '多选题', judge: '判断题' };
const KEY = 'dc-om-quiz-v1';

function load() {
  try {
    const s = localStorage.getItem(KEY);
    return s ? JSON.parse(s) : null;
  } catch (e) { return null; }
}
let state = load() || {};
if (!state.answered) state.answered = {};
if (!state.pos) state.pos = {};
if (!state.bank || !BANKS.some(b => b.id === state.bank)) state.bank = BANKS[0].id;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function curBank() { return BANKS.find(b => b.id === state.bank); }
function bankAll(b) { return [...b.singles, ...b.multis, ...b.judges]; }
let ALL = [];
function rebuildAll() { ALL = bankAll(curBank()); }

let filter = state.filter || 'all';
if (filter === 'wrong') filter = 'all';
let orderMode = state.order || 'seq';
let list = [];
let idx = 0;

function idsFor(f) {
  const b = curBank();
  if (f === 'single') return b.singles.map(q => q.id);
  if (f === 'multi') return b.multis.map(q => q.id);
  if (f === 'judge') return b.judges.map(q => q.id);
  return ALL.map(q => q.id);
}
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function wrongIds() {
  return ALL.filter(q => state.answered[q.id] && !state.answered[q.id].correct).map(q => q.id);
}
function buildList() {
  let ids = filter === 'wrong' ? wrongIds() : idsFor(filter);
  if (filter === 'wrong') ids = ids.slice();
  else if (orderMode === 'rand') ids = shuffle(ids.slice());
  list = ids;
  idx = Math.min(state.pos[filter + '|' + orderMode] || 0, Math.max(0, list.length - 1));
}
function savePos() {
  state.pos[filter + '|' + orderMode] = idx;
  save();
}

function answerText(q) {
  if (q.type === 'judge') return q.answer === 'T' ? '正确' : '错误';
  if (q.type === 'multi') return q.answer.split('').join(' ');
  return q.answer;
}

function submit(q, sel) {
  let correct;
  if (q.type === 'multi') {
    const a = [...q.answer].sort().join('');
    const s = [...sel].sort().join('');
    correct = a === s;
  } else {
    correct = sel === q.answer;
  }
  state.answered[q.id] = { sel, correct, ts: Date.now() };
  save();
  render();
  updateHeader();
}

function render() {
  const card = document.getElementById('qcard');
  if (!list.length) {
    const msg = filter === 'wrong'
      ? '错题已清空，继续保持。'
      : '当前没有题目。';
    card.innerHTML = `<div class="empty">${msg}</div>`;
    updateProgress();
    return;
  }
  const q = list.map(id => ALL.find(x => x.id === id))[idx];
  const rec = state.answered[q.id];
  let html = '<div class="qmeta">';
  html += `<span class="badge ${q.type}">${TYPE_NAME[q.type]}</span>`;
  if (q.source) html += `<span class="badge src">${esc(q.source)}</span>`;
  if (filter === 'wrong') html += '<span class="badge wrongtag">错题重练</span>';
  html += `<span class="qidx">第 ${idx + 1} / ${list.length} 题</span></div>`;
  html += `<div class="stem">${esc(q.stem)}</div>`;
  if (q.type === 'multi' && !rec) html += '<div class="hint">多选题：点选所有正确项后点击「确认答案」</div>';

  if (q.type === 'single' || q.type === 'multi') {
    q.options.forEach((opt, i) => {
      const L = 'ABCDEF'[i];
      let cls = 'opt';
      if (rec) {
        const sel = Array.isArray(rec.sel) ? rec.sel : [rec.sel];
        const isAns = q.answer.includes(L);
        const isSel = sel.includes(L);
        if (isAns) cls += ' correct';
        else if (isSel) cls += ' wrong';
        else cls += ' dim';
      }
      html += `<button class="${cls}" data-l="${L}" ${rec ? 'disabled' : ''}><span class="letter">${L}</span><span class="content">${esc(opt)}</span></button>`;
    });
    if (q.type === 'multi' && !rec) {
      html += '<button class="btn confirm" id="confirmMulti" disabled>确认答案</button>';
    }
  } else {
    [['T', '正确'], ['F', '错误']].forEach(([v, label]) => {
      let cls = 'opt judge-opt';
      if (rec) {
        const isAns = q.answer === v;
        const isSel = rec.sel === v;
        if (isAns) cls += ' correct';
        else if (isSel) cls += ' wrong';
        else cls += ' dim';
      }
      html += `<button class="${cls}" data-l="${v}" ${rec ? 'disabled' : ''}><span class="letter">${v === 'T' ? '✓' : '✗'}</span><span class="content">${label}</span></button>`;
    });
  }

  if (rec) {
    html += `<div class="feedback ${rec.correct ? 'ok' : 'bad'}">`;
    html += `<div class="fb-title ${rec.correct ? 'ok' : 'bad'}">${rec.correct ? '✔ 回答正确' : '✘ 回答错误 · 正确答案：' + answerText(q)}</div>`;
    html += `<div class="fb-exp">${esc(q.explain)}</div>`;
    html += '<div class="fb-redo"><a href="javascript:void(0)" id="redo">重做本题</a></div></div>';
  }

  html += `<div class="actions"><button class="btn ghost" id="prevBtn" ${idx === 0 ? 'disabled' : ''}>上一题</button><button class="btn" id="nextBtn" ${idx >= list.length - 1 ? 'disabled' : ''}>下一题</button></div>`;
  card.innerHTML = html;
  bindCardEvents(q);
  updateProgress();
}

function bindCardEvents(q) {
  const card = document.getElementById('qcard');
  card.querySelectorAll('.opt[data-l]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (state.answered[q.id]) return;
      const L = btn.dataset.l;
      if (q.type === 'multi') {
        btn.classList.toggle('sel');
        const sel = [...card.querySelectorAll('.opt.sel')].map(b => b.dataset.l);
        const c = document.getElementById('confirmMulti');
        if (c) {
          c.disabled = sel.length === 0;
          c.textContent = sel.length ? `确认答案（已选 ${sel.length} 项）` : '确认答案';
        }
      } else {
        submit(q, L);
      }
    });
  });
  const cm = document.getElementById('confirmMulti');
  if (cm) cm.addEventListener('click', () => {
    const sel = [...card.querySelectorAll('.opt.sel')].map(b => b.dataset.l).sort();
    submit(q, sel);
  });
  const prev = document.getElementById('prevBtn');
  const next = document.getElementById('nextBtn');
  if (prev) prev.addEventListener('click', () => { if (idx > 0) { idx--; savePos(); render(); } });
  if (next) next.addEventListener('click', () => { if (idx < list.length - 1) { idx++; savePos(); render(); } });
  const redo = document.getElementById('redo');
  if (redo) redo.addEventListener('click', () => {
    delete state.answered[q.id];
    save();
    render();
    updateHeader();
  });
}

function updateProgress() {
  const total = list.length || 1;
  const done = list.filter(id => state.answered[id]).length;
  const pct = Math.round(done / total * 100);
  const fill = document.getElementById('progressFill');
  if (fill) fill.style.width = pct + '%';
}

function updateHeader() {
  const b = curBank();
  const recs = ALL.map(q => state.answered[q.id]).filter(Boolean);
  const done = recs.length;
  const correct = recs.filter(r => r.correct).length;
  document.getElementById('bankSub').textContent =
    `${b.name} · 单选 ${b.singles.length} · 多选 ${b.multis.length} · 判断 ${b.judges.length}`;
  document.getElementById('miniDone').innerHTML = `${done}<span>/${ALL.length}</span>`;
  document.getElementById('miniAcc').textContent = done ? Math.round(correct / done * 100) + '%' : '—';
  const wrongN = done - correct;
  const wc = document.getElementById('wrongCount');
  if (wrongN > 0) { wc.style.display = 'inline-flex'; wc.textContent = wrongN; }
  else wc.style.display = 'none';
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'tab-' + name));
  if (name === 'wrong') renderWrongList();
  if (name === 'stats') renderStats();
}

function renderWrongList() {
  const ids = wrongIds();
  const box = document.getElementById('wrongList');
  document.getElementById('wrongTitle').textContent = `错题本（${curBank().name}）`;
  if (!ids.length) {
    box.innerHTML = '<div class="empty">当前卷组暂无错题。答错的题会自动出现在这里。</div>';
    return;
  }
  box.innerHTML = ids.map(id => {
    const q = ALL.find(x => x.id === id);
    const r = state.answered[id];
    const selText = q.type === 'judge'
      ? (r.sel === 'T' ? '正确' : '错误')
      : (Array.isArray(r.sel) ? r.sel.join('') : r.sel);
    return `<div class="wrong-item"><div class="wi-main" data-id="${id}">
      <div class="wi-stem">${esc(q.stem)}</div>
      <div class="wi-meta"><span>${TYPE_NAME[q.type]}</span><span class="x">你选 ${esc(selText)}</span><span class="v">正确 ${answerText(q)}</span><span>${esc(q.source || '')}</span></div>
    </div><button class="go" data-id="${id}">重练</button></div>`;
  }).join('');
  box.querySelectorAll('[data-id]').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.id;
      filter = 'wrong';
      orderMode = 'seq';
      syncChips();
      buildList();
      const p = list.indexOf(id);
      if (p >= 0) idx = p;
      render();
      switchTab('practice');
    });
  });
}

function renderStats() {
  const b = curBank();
  const recs = ALL.map(q => state.answered[q.id]).filter(Boolean);
  const done = recs.length;
  const correct = recs.filter(r => r.correct).length;
  const wrongN = done - correct;
  document.getElementById('statCards').innerHTML = `
    <div class="stat-card"><div class="num">${done}<span style="font-size:13px;color:#94a3b8">/${ALL.length}</span></div><div class="lab">已答题目（${esc(b.name)}）</div></div>
    <div class="stat-card"><div class="num">${done ? Math.round(correct / done * 100) : 0}%</div><div class="lab">总正确率</div></div>
    <div class="stat-card"><div class="num" style="color:#b91c1c">${wrongN}</div><div class="lab">当前错题</div></div>
    <div class="stat-card"><div class="num" style="color:#15803d">${correct}</div><div class="lab">答对题数</div></div>`;
  const rows = [['single', b.singles], ['multi', b.multis], ['judge', b.judges]].map(([t, qs]) => {
    const recs2 = qs.map(q => state.answered[q.id]).filter(Boolean);
    const d = recs2.length;
    const c = recs2.filter(r => r.correct).length;
    return `<tr><td>${TYPE_NAME[t]}</td><td>${qs.length}</td><td>${d}</td><td>${c}</td><td>${d ? Math.round(c / d * 100) + '%' : '—'}</td></tr>`;
  }).join('');
  document.getElementById('statBody').innerHTML = rows;
}

function syncChips() {
  document.querySelectorAll('#bankChips .chip').forEach(b => b.classList.toggle('active', b.dataset.bank === state.bank));
  document.querySelectorAll('#typeChips .chip').forEach(b => b.classList.toggle('active', b.dataset.type === filter));
  document.querySelectorAll('#orderChips .chip').forEach(b => b.classList.toggle('active', b.dataset.order === orderMode));
}

function renderBankChips() {
  const box = document.getElementById('bankChips');
  box.innerHTML = BANKS.map(b => {
    const total = b.singles.length + b.multis.length + b.judges.length;
    return `<button class="chip bank${b.id === state.bank ? ' active' : ''}" data-bank="${b.id}">${esc(b.name)}<span class="cnt">${total}题</span></button>`;
  }).join('');
}

function mdToHtml(md) {
  const lines = md.split('\n');
  let html = '';
  let inOl = false, inUl = false;
  const close = () => { if (inOl) { html += '</ol>'; inOl = false; } if (inUl) { html += '</ul>'; inUl = false; } };
  const bold = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  for (const raw of lines) {
    const line = raw.trimEnd();
    if (!line.trim()) { close(); continue; }
    let m;
    if ((m = line.match(/^\d+\.\s+(.*)$/))) {
      if (!inOl) { close(); html += '<ol>'; inOl = true; }
      html += '<li>' + bold(m[1]) + '</li>';
      continue;
    }
    if ((m = line.match(/^[-•]\s+(.*)$/))) {
      if (!inUl) { close(); html += '<ul>'; inUl = true; }
      html += '<li>' + bold(m[1]) + '</li>';
      continue;
    }
    close();
    html += '<p>' + bold(line.trim()) + '</p>';
  }
  close();
  return html;
}

function initSubjective() {
  const box = document.getElementById('subjList');
  let html = '';
  for (const b of BANKS) {
    if (!b.subjective || !b.subjective.length) continue;
    const tag = b.id === 'mock120' ? '预测' : '简答';
    html += `<div class="subj-group">${esc(b.name)}<span class="count">${b.subjective.length} 道${b.id === 'mock120' ? '预测大题' : '简答题'}</span></div>`;
    html += b.subjective.map((s, i) => `
      <div class="subj${i === 0 && b.id === 'mock120' ? ' open' : ''}">
        <button class="subj-head">
          ${s.stars ? `<span class="stars">${'★'.repeat(s.stars)}${'☆'.repeat(Math.max(0, 5 - s.stars))}</span>` : ''}
          <b>${tag}${s.no}</b>
          <span class="subj-title">${esc(s.title)}</span>
          <i class="chev">▾</i>
        </button>
        <div class="subj-body">${mdToHtml(s.body)}</div>
      </div>`).join('');
  }
  box.innerHTML = html;
  box.querySelectorAll('.subj-head').forEach(btn => {
    btn.addEventListener('click', () => btn.parentElement.classList.toggle('open'));
  });
}

function init() {
  document.getElementById('tabs').addEventListener('click', e => {
    const btn = e.target.closest('.tab');
    if (btn) switchTab(btn.dataset.tab);
  });

  renderBankChips();
  document.getElementById('bankChips').addEventListener('click', e => {
    const btn = e.target.closest('.chip');
    if (!btn || btn.dataset.bank === state.bank) return;
    state.bank = btn.dataset.bank;
    filter = 'all';
    state.filter = 'all';
    save();
    rebuildAll();
    syncChips();
    buildList();
    render();
    updateHeader();
  });

  document.querySelectorAll('#typeChips .chip').forEach(b => {
    b.addEventListener('click', () => {
      filter = b.dataset.type;
      state.filter = filter;
      save();
      syncChips();
      buildList();
      render();
    });
  });
  document.querySelectorAll('#orderChips .chip').forEach(b => {
    b.addEventListener('click', () => {
      orderMode = b.dataset.order;
      state.order = orderMode;
      save();
      syncChips();
      buildList();
      render();
    });
  });
  document.getElementById('startWrong').addEventListener('click', () => {
    if (!wrongIds().length) { alert('暂无错题，先去刷题吧。'); return; }
    filter = 'wrong';
    orderMode = 'seq';
    syncChips();
    buildList();
    render();
    switchTab('practice');
  });
  document.getElementById('resetAll').addEventListener('click', () => {
    if (!confirm('确定重置全部卷组的答题进度与错题本？此操作不可恢复。')) return;
    state = { answered: {}, filter: 'all', order: 'seq', pos: {}, bank: state.bank };
    filter = 'all';
    orderMode = 'seq';
    save();
    syncChips();
    buildList();
    render();
    updateHeader();
    renderStats();
  });

  rebuildAll();
  syncChips();
  initSubjective();
  buildList();
  render();
  updateHeader();
}

init();
</script>
</body>
</html>
